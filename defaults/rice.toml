# Canonical rice configuration.
# The installer replaces the placeholder output and application entries with
# values detected on the target machine.

desktop_widget = []

[meta]
schema_version = 1

[[output]]
id = "main"
role = "main"
connector = "DP-1"
primary = true

[[zone]]
id = "center-left"
output = "main"
kind = "app"
x = 0.0
y = 0.0
w = 0.5
h = 1.0
gap_px = 8

[[zone]]
id = "center-right"
output = "main"
kind = "app"
x = 0.5
y = 0.0
w = 0.5
h = 1.0
gap_px = 8

[[app]]
id = "browser"
name = "Browser"
command = ["firefox"]
wm_class = "firefox"

[[placement]]
app = "browser"
activity = "private"
zone = "center-left"
mode = "normal"

[activities.private]
name = "Private"
kde_id = ""

[activities.work]
name = "Work"
kde_id = ""

[startup]
always = []
private = ["browser"]

[autostart.private]
apps = []

[autostart.work]
apps = []
