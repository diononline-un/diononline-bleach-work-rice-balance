[toggles.steam]
name = "Steam"
package = "steam"
command = ["steam"]
wm_class = "steam"
activities = ["private"]
optional = true

[toggles.discord]
name = "Discord"
package = "discord"
command = ["discord"]
wm_class = "discord"
activities = ["private"]
optional = true

[toggles.opencode]
name = "OpenCode"
package = "opencode-bin"
command = ["opencode"]
